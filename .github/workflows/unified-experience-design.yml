name: Unified experience design checks
on:
  pull_request:
    paths:
      - ".github/design-concepts/unified-*.html"
      - ".github/design-concepts/material-organic-homepage.html"
      - ".github/design-concepts/unified-tokens.css"
      - ".github/design-concepts/unified-customer.js"
      - "tests/unified-experience-design.test.mjs"
      - "tests/unified-customer-model.test.mjs"
      - "tests/material-organic-homepage.test.mjs"
      - ".github/workflows/unified-experience-design.yml"
permissions:
  contents: read
jobs:
  design-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run synthetic design contract checks
        run: node --test tests/unified-experience-design.test.mjs tests/unified-customer-model.test.mjs tests/material-organic-homepage.test.mjs
