name: Draft legacy intake pause - source checks

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "tests/emergency-form-paused.test.mjs"
      - ".github/workflows/emergency-intake-pause.yml"

permissions:
  contents: read

jobs:
  source-check:
    name: Non-networked source regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Check legacy script syntax
        run: node --check app.js
      - name: Verify legacy form pause and contact fallback
        run: node --test tests/emergency-form-paused.test.mjs
