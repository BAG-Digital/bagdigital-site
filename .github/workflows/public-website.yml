name: Public Field Notes site candidate checks

on:
  pull_request:
    paths:
      - "index.html"
      - "privacy.html"
      - "pricing.html"
      - "pricing.css"
      - "examples/**"
      - "tests/website-examples.test.mjs"
      - "styles.css"
      - "tests/production-homepage.test.mjs"
      - "tests/production-browser-smoke.mjs"
      - ".github/workflows/public-website.yml"
      - "README.md"
      - "sitemap.xml"
      - "robots.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout
        with:
          persist-credentials: false
      - name: Run offline public-site content and security contracts
        run: node --test tests/production-homepage.test.mjs tests/website-examples.test.mjs
      - name: Run non-submitting local-HTTP Chromium form smoke test
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::Chrome/Chromium unavailable for browser smoke test"
            exit 1
          fi
          export BROWSER
          node tests/production-browser-smoke.mjs
      - name: Capture responsive site screenshots without deployment
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::Chrome/Chromium unavailable for static screenshot checks"
            exit 1
          fi
          mkdir -p public-site-screenshots
          for width in 320 375 768 1440; do
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --window-size="${width},1000" \
              --screenshot="public-site-screenshots/homepage-${width}.png" \
              "file://${PWD}/index.html" >/tmp/bagdigital-website-chromium.log 2>&1 || {
                cat /tmp/bagdigital-website-chromium.log
                exit 1
              }
            test -s "public-site-screenshots/homepage-${width}.png"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --window-size="${width},1000" \
              --screenshot="public-site-screenshots/pricing-${width}.png" \
              "file://${PWD}/pricing.html" >/tmp/bagdigital-pricing-chromium.log 2>&1 || {
                cat /tmp/bagdigital-pricing-chromium.log
                exit 1
              }
            test -s "public-site-screenshots/pricing-${width}.png"
          done
      - name: Capture real fictional website example layouts without submission
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$BROWSER" ]] || { echo "::error::Chromium missing"; exit 1; }
          for width in 320 375 768 1440; do
            for example in "examples/index.html:examples-menu" "examples/one-page/index.html:one-page-1295" "examples/business/index.html:business-2795" "examples/business/contact.html:business-contact"; do
              page="${example%%:*}"
              label="${example##*:}"
              "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
                --virtual-time-budget=5000 --window-size="${width},1000" \
                --screenshot="public-site-screenshots/${label}-${width}.png" \
                "file://${PWD}/${page}" >/tmp/bagdigital-examples-chromium.log 2>&1 || {
                  cat /tmp/bagdigital-examples-chromium.log
                  exit 1
                }
              test -s "public-site-screenshots/${label}-${width}.png"
            done
          done
      - name: Capture deep-scroll responsive demonstrations
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$BROWSER" ]] || { echo "::error::Chromium missing"; exit 1; }
          for example in "examples/one-page/index.html:one-page-1295" "examples/business/index.html:business-2795"; do
            page="${example%%:*}"
            label="${example##*:}"
            for device in "375:6000:mobile" "1440:4400:desktop"; do
              width="${device%%:*}"
              rest="${device#*:}"
              height="${rest%%:*}"
              device_label="${rest##*:}"
              "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
                --virtual-time-budget=6500 --window-size="${width},${height}" \
                --screenshot="public-site-screenshots/${label}-deep-${device_label}.png" \
                "file://${PWD}/${page}" >/tmp/bagdigital-examples-deep-chromium.log 2>&1 || {
                  cat /tmp/bagdigital-examples-deep-chromium.log
                  exit 1
                }
              test -s "public-site-screenshots/${label}-deep-${device_label}.png"
            done
          done
      - name: Store screenshots for Indigo, Prism and founder review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bagdigital-public-homepage-responsive
          # Include exact public source alongside visual captures for repeatable local UX checks.
          path: |
            public-site-screenshots/*.png
            index.html
            privacy.html
            pricing.html
            pricing.css
            styles.css
            examples/**
          if-no-files-found: error
          retention-days: 14
