name: Site26 offline first-party inquiry UX

on:
  pull_request:
    paths:
      - "intake/ui/**"
      - "tests/site26-ui-controller.test.mjs"
      - "docs/site26/protected-inquiry-ux-handoff.md"
      - ".github/workflows/site26-ui.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Source syntax and synthetic UI contract
        run: |
          set -euo pipefail
          node --check intake/ui/contact-controller.mjs
          node --check tests/site26-ui-controller.test.mjs
          node --test tests/site26-ui-controller.test.mjs
      - name: Assert PR did not change any published site file
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -E '^(index.html|privacy.html|styles.css|app.js|CNAME|sitemap.xml|robots.txt|wrangler\.|\.github/workflows/(public-website|deploy))' ; then
            echo "Forbidden public website or deployment diff"
            exit 1
          fi
